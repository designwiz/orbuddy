name: OrbBuddy CI

on:
  push:
    branches: [orbbuddy-v0.1]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build OrbBuddy firmware
        run: pio run -e esp32-s3-amoled-175
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OrbBuddy-v0.1-firmware
          path: |
            .pio/build/esp32-s3-amoled-175/firmware.bin
            .pio/build/esp32-s3-amoled-175/bootloader.bin
            .pio/build/esp32-s3-amoled-175/partitions.bin
