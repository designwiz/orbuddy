name: OrbBuddy CI

on:
  push:
    branches: [orbbuddy-v0.1]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build OrbBuddy firmware
        run: pio run -e esp32-s3-amoled-175
      - name: Verify application flash offset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path("partitions_16MB_themeart.csv")
          rows = list(csv.reader(line for line in p.read_text().splitlines() if line.strip() and not line.lstrip().startswith("#")))
          apps = [r for r in rows if len(r) >= 5 and r[1].strip() == "app"]
          print("Application partitions:")
          for r in apps:
              print(f"  {r[0].strip()}: offset={r[3].strip()} size={r[4].strip()}")
          if not apps:
              raise SystemExit("No application partition found")
          first = int(apps[0][3].strip(), 0)
          if first != 0x10000:
              raise SystemExit(f"Unexpected first app offset: 0x{first:x}")
          print("Verified first application offset: 0x10000")
          PY
      - name: Upload application firmware only
        uses: actions/upload-artifact@v4
        with:
          name: OrbBuddy-v0.1-APP-ONLY
          path: .pio/build/esp32-s3-amoled-175/firmware.bin
