name: OrbBuddy CI

on:
  push:
    branches: [orbbuddy-v0.1]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build OrbBuddy firmware
        run: pio run -e esp32-s3-amoled-175
      - name: Create single full-flash image
        run: |
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          BUILD=".pio/build/esp32-s3-amoled-175"
          BOOTAPP="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          python "$ESPTOOL" --chip esp32s3 merge_bin -o "$BUILD/OrbBuddy-v0.1-full.bin" \
            0x0000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$BOOTAPP" \
            0x10000 "$BUILD/firmware.bin"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OrbBuddy-v0.1-firmware
          path: |
            .pio/build/esp32-s3-amoled-175/OrbBuddy-v0.1-full.bin
            .pio/build/esp32-s3-amoled-175/firmware.bin
            .pio/build/esp32-s3-amoled-175/bootloader.bin
            .pio/build/esp32-s3-amoled-175/partitions.bin
