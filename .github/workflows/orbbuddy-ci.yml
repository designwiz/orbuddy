name: OrbBuddy CI

on:
  push:
    branches: [orbbuddy-v0.1]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build OrbBuddy firmware
        run: pio run -e esp32-s3-amoled-175
      - name: Create single full-flash image
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          env = "esp32-s3-amoled-175"
          build = pathlib.Path(".pio/build") / env
          data = json.loads((build / "idedata.json").read_text())
          extra = data.get("extra", {})
          flash_images = extra.get("flash_images", [])
          if not flash_images:
              raise SystemExit("PlatformIO idedata.json did not contain flash_images")
          esptool = pathlib.Path.home() / ".platformio/packages/tool-esptoolpy/esptool.py"
          cmd = ["python", str(esptool), "--chip", "esp32s3", "merge_bin", "-o", str(build / "OrbBuddy-v0.1-full.bin")]
          for offset, image in flash_images:
              p = pathlib.Path(image)
              if not p.is_absolute():
                  p = pathlib.Path.cwd() / p
              cmd += [str(offset), str(p)]
          print("Merging:", " ".join(cmd))
          subprocess.check_call(cmd)
          PY
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OrbBuddy-v0.1-firmware
          path: |
            .pio/build/esp32-s3-amoled-175/OrbBuddy-v0.1-full.bin
            .pio/build/esp32-s3-amoled-175/firmware.bin
            .pio/build/esp32-s3-amoled-175/bootloader.bin
            .pio/build/esp32-s3-amoled-175/partitions.bin
